<svg viewBox="0 0 640 298" width="640" height="298" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="298" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="298" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">Combining Components</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">1.</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Arrays)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Build</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">list</tspan><tspan dx="4" font-weight="400" fill="#3D3554">of</tspan><tspan dx="4" font-weight="400" fill="#3D3554">student</tspan><tspan dx="4" font-weight="400" fill="#3D3554">scores.</tspan></text>
<circle cx="36" cy="114.5" r="6" fill="#7C5CFF"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">2.</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Variables)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Create</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">"highest"</tspan><tspan dx="4" font-weight="400" fill="#3D3554">variable,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">set</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">0.</tspan></text>
<circle cx="36" cy="162.5" r="6" fill="#7C5CFF"/>
<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">3.</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Loops)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">For-Each</tspan><tspan dx="4" font-weight="400" fill="#3D3554">over</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">scores.</tspan></text>
<circle cx="36" cy="210.5" r="6" fill="#7C5CFF"/>
<text x="58" y="217" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">4.</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Conditionals)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">If</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">current</tspan><tspan dx="4" font-weight="400" fill="#3D3554">score</tspan><tspan dx="4" font-weight="400" fill="#3D3554">beats</tspan><tspan dx="4" font-weight="400" fill="#3D3554">"highest"...</tspan></text>
<circle cx="36" cy="258.5" r="6" fill="#7C5CFF"/>
<text x="58" y="265" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">5.</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Variables)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">...update</tspan><tspan dx="4" font-weight="400" fill="#3D3554">"highest"</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">current</tspan><tspan dx="4" font-weight="400" fill="#3D3554">score.</tspan></text>
</svg>