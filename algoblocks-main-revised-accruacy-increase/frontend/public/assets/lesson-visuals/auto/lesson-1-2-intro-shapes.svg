<svg viewBox="0 0 640 346" width="640" height="346" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="346" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="346" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">Characteristic Shapes</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(1)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">is</tspan><tspan dx="4" font-weight="400" fill="#3D3554">flat.</tspan></text>
<circle cx="36" cy="114.5" r="6" fill="#7C5CFF"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(log</tspan><tspan dx="4" font-weight="400" fill="#3D3554">n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">rises</tspan><tspan dx="4" font-weight="400" fill="#3D3554">slowly.</tspan></text>
<circle cx="36" cy="162.5" r="6" fill="#7C5CFF"/>
<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">climbs</tspan><tspan dx="4" font-weight="400" fill="#3D3554">steadily.</tspan></text>
<circle cx="36" cy="210.5" r="6" fill="#7C5CFF"/>
<text x="58" y="217" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(n</tspan><tspan dx="4" font-weight="400" fill="#3D3554">log</tspan><tspan dx="4" font-weight="400" fill="#3D3554">n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">curves</tspan><tspan dx="4" font-weight="400" fill="#3D3554">moderately.</tspan></text>
<circle cx="36" cy="258.5" r="6" fill="#7C5CFF"/>
<text x="58" y="265" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(n²)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">shoots</tspan><tspan dx="4" font-weight="400" fill="#3D3554">up</tspan><tspan dx="4" font-weight="400" fill="#3D3554">steeply.</tspan></text>
<circle cx="36" cy="306.5" r="6" fill="#7C5CFF"/>
<text x="58" y="313" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(2^n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">explodes.</tspan></text>
</svg>