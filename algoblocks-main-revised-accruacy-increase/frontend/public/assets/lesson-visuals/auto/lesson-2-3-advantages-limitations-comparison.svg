<text x="360.0" y="135" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#7A1E1E">Bubble</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">Sort</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">writes</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">a</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">lot</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">--</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">heavy</tspan></text>
<text x="360.0" y="154" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A3B3B">swap</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">overhead.</tspan></text>
<circle cx="343.0" cy="190.5" r="11" fill="#EF4444"/>
<path d="M 339.0 186.5 L 347.0 194.5 M 347.0 186.5 L 339.0 194.5" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="360.0" y="197" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#7A1E1E">Not</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">adaptive</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">--</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">doesn't</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">notice</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">data</tspan></text>
<text x="360.0" y="216" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A3B3B">that's</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">already</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">mostly</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">sorted.</tspan></text>
