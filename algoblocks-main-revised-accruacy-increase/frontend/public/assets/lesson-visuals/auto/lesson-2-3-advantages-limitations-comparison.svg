<text x="52" y="264" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#33534A">elements</tspan><tspan dx="4" font-weight="400" fill="#33534A">keep</tspan><tspan dx="4" font-weight="400" fill="#33534A">their</tspan><tspan dx="4" font-weight="400" fill="#33534A">original</tspan><tspan dx="4" font-weight="400" fill="#33534A">order.</tspan></text>
<text x="332.0" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7A1E1E">System Vulnerabilities</text>
