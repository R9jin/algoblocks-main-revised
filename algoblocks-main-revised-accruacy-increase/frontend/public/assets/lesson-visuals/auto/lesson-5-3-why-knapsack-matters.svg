<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A4A2E">Introduces</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">the</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">foundational</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">2D</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">Dynamic</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">Programming</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">matrix.</tspan></text>
<polygon points="36.0,201.0 38.5,207.1 45.0,207.6 40.0,211.8 41.6,218.2 36.0,214.7 30.4,218.2 32.0,211.8 27.0,207.6 33.5,207.1" fill="#F59E0B"/>
<text x="58" y="217" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A4A2E">Appears</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">natively</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">in</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">budgeting</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">and</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">logistics</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">systems.</tspan></text>
