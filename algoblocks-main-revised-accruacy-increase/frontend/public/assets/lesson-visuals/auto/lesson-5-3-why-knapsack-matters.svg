<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A4A2E">Teaches</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">multi-variable</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">decision-making</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">under</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">limitations.</tspan></text>
