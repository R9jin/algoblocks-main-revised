<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7A4A02">Why the Knapsack Problem Matters</text>
<polygon points="36.0,57.0 38.5,63.1 45.0,63.6 40.0,67.8 41.6,74.2 36.0,70.7 30.4,74.2 32.0,67.8 27.0,63.6 33.5,63.1" fill="#F59E0B"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A4A2E">Demonstrates</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">complex</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">constrained</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">optimization.</tspan></text>
