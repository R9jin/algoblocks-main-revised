<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Reverse</tspan><tspan dx="4" font-weight="700" fill="#2B005C">Traversal</tspan><tspan dx="4" font-weight="400" fill="#3D3554">and</tspan><tspan dx="4" font-weight="700" fill="#2B005C">Boundary</tspan><tspan dx="4" font-weight="700" fill="#2B005C">Clamping</tspan><tspan dx="4" font-weight="400" fill="#3D3554">handle</tspan><tspan dx="4" font-weight="400" fill="#3D3554">specialized</tspan><tspan dx="4" font-weight="400" fill="#3D3554">queries.</tspan></text>
