<text x="58" y="265" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">Dynamic</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Programming</tspan><tspan dx="4" font-weight="400" fill="#3D3554">reduces</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Fibonacci</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="700" fill="#2B005C">linear</tspan><tspan dx="4" font-weight="700" fill="#2B005C">time</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(`O(n)`).</tspan></text>
