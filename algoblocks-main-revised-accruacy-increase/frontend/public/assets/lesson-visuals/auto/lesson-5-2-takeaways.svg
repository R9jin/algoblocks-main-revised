<text x="58" y="313" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Space</tspan><tspan dx="4" font-weight="700" fill="#2B005C">optimization</tspan><tspan dx="4" font-weight="400" fill="#3D3554">can</tspan><tspan dx="4" font-weight="400" fill="#3D3554">reduce</tspan><tspan dx="4" font-weight="400" fill="#3D3554">memory</tspan><tspan dx="4" font-weight="400" fill="#3D3554">complexity</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">absolute</tspan><tspan dx="4" font-weight="400" fill="#2B005C" font-family="Consolas, monospace">O(1)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">.</tspan></text>
