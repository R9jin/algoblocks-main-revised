<text x="58" y="217" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Tabulation</tspan><tspan dx="4" font-weight="400" fill="#3D3554">builds</tspan><tspan dx="4" font-weight="400" fill="#3D3554">answers</tspan><tspan dx="4" font-weight="400" fill="#3D3554">iteratively</tspan><tspan dx="4" font-weight="400" fill="#3D3554">in</tspan><tspan dx="4" font-weight="400" fill="#3D3554">an</tspan><tspan dx="4" font-weight="400" fill="#3D3554">array</tspan><tspan dx="4" font-weight="400" fill="#3D3554">(Bottom-Up).</tspan></text>
