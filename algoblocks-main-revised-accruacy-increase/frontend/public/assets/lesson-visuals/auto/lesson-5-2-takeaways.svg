<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">Naive</tspan><tspan dx="4" font-weight="400" fill="#3D3554">recursion</tspan><tspan dx="4" font-weight="400" fill="#3D3554">repeatedly</tspan><tspan dx="4" font-weight="400" fill="#3D3554">recomputes</tspan><tspan dx="4" font-weight="400" fill="#3D3554">identical</tspan><tspan dx="4" font-weight="400" fill="#3D3554">values</tspan><tspan dx="4" font-weight="400" fill="#3D3554">(</tspan><tspan dx="4" font-weight="400" fill="#2B005C" font-family="Consolas, monospace">O(2^n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">).</tspan></text>
