<svg viewBox="0 0 640 346" width="640" height="346" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="346" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="346" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">Efficiency Tiers</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(1)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">constant,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">excellent</tspan><tspan dx="4" font-weight="400" fill="#3D3554">scalability.</tspan></text>
<circle cx="36" cy="114.5" r="6" fill="#7C5CFF"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(log</tspan><tspan dx="4" font-weight="400" fill="#3D3554">n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">grows</tspan><tspan dx="4" font-weight="400" fill="#3D3554">very</tspan><tspan dx="4" font-weight="400" fill="#3D3554">slowly,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">excellent</tspan><tspan dx="4" font-weight="400" fill="#3D3554">for</tspan><tspan dx="4" font-weight="400" fill="#3D3554">large</tspan><tspan dx="4" font-weight="400" fill="#3D3554">sorted</tspan><tspan dx="4" font-weight="400" fill="#3D3554">data.</tspan></text>
<circle cx="36" cy="162.5" r="6" fill="#7C5CFF"/>
<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">grows</tspan><tspan dx="4" font-weight="400" fill="#3D3554">steadily,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">fine</tspan><tspan dx="4" font-weight="400" fill="#3D3554">when</tspan><tspan dx="4" font-weight="400" fill="#3D3554">every</tspan><tspan dx="4" font-weight="400" fill="#3D3554">item</tspan><tspan dx="4" font-weight="400" fill="#3D3554">must</tspan><tspan dx="4" font-weight="400" fill="#3D3554">be</tspan><tspan dx="4" font-weight="400" fill="#3D3554">touched.</tspan></text>
<circle cx="36" cy="210.5" r="6" fill="#7C5CFF"/>
<text x="58" y="217" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(n</tspan><tspan dx="4" font-weight="400" fill="#3D3554">log</tspan><tspan dx="4" font-weight="400" fill="#3D3554">n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">grows</tspan><tspan dx="4" font-weight="400" fill="#3D3554">moderately,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">standard</tspan><tspan dx="4" font-weight="400" fill="#3D3554">for</tspan><tspan dx="4" font-weight="400" fill="#3D3554">efficient</tspan><tspan dx="4" font-weight="400" fill="#3D3554">sorting.</tspan></text>
<circle cx="36" cy="258.5" r="6" fill="#7C5CFF"/>
<text x="58" y="265" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(n²)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">grows</tspan><tspan dx="4" font-weight="400" fill="#3D3554">fast,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">poor</tspan><tspan dx="4" font-weight="400" fill="#3D3554">at</tspan><tspan dx="4" font-weight="400" fill="#3D3554">scale</tspan><tspan dx="4" font-weight="400" fill="#3D3554">(n=10,000</tspan><tspan dx="4" font-weight="400" fill="#3D3554">→</tspan><tspan dx="4" font-weight="400" fill="#3D3554">100M</tspan><tspan dx="4" font-weight="400" fill="#3D3554">ops</tspan><tspan dx="4" font-weight="400" fill="#3D3554">vs</tspan><tspan dx="4" font-weight="400" fill="#3D3554">~132,000</tspan><tspan dx="4" font-weight="400" fill="#3D3554">for</tspan><tspan dx="4" font-weight="400" fill="#3D3554">O(n</tspan><tspan dx="4" font-weight="400" fill="#3D3554">log</tspan><tspan dx="4" font-weight="400" fill="#3D3554">n)).</tspan></text>
<circle cx="36" cy="306.5" r="6" fill="#7C5CFF"/>
<text x="58" y="313" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">O(2^n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">explodes,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">impractical</tspan><tspan dx="4" font-weight="400" fill="#3D3554">past</tspan><tspan dx="4" font-weight="400" fill="#3D3554">n≈30.</tspan></text>
</svg>