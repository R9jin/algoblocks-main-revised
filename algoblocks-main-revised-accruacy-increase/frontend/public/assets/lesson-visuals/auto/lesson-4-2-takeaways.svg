<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">Greedy</tspan><tspan dx="4" font-weight="400" fill="#3D3554">repeatedly</tspan><tspan dx="4" font-weight="400" fill="#3D3554">takes</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="700" fill="#2B005C">largest</tspan><tspan dx="4" font-weight="700" fill="#2B005C">denomination</tspan><tspan dx="4" font-weight="700" fill="#2B005C">that</tspan><tspan dx="4" font-weight="700" fill="#2B005C">fits.</tspan></text>
