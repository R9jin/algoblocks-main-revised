<svg viewBox="0 0 640 264" width="640" height="264" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="264" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="264" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">Optimization Strategies</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Memoization:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">caches</tspan><tspan dx="4" font-weight="400" fill="#3D3554">results</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">drops</tspan><tspan dx="4" font-weight="400" fill="#3D3554">naive</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Fibonacci</tspan><tspan dx="4" font-weight="400" fill="#3D3554">from</tspan><tspan dx="4" font-weight="400" fill="#3D3554">O(2^n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">O(n).</tspan></text>
<circle cx="36" cy="114.5" r="6" fill="#7C5CFF"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Dynamic</tspan><tspan dx="4" font-weight="700" fill="#2B005C">programming:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">solves</tspan><tspan dx="4" font-weight="400" fill="#3D3554">each</tspan><tspan dx="4" font-weight="400" fill="#3D3554">subproblem</tspan><tspan dx="4" font-weight="400" fill="#3D3554">once.</tspan></text>
<circle cx="36" cy="162.5" r="6" fill="#7C5CFF"/>
<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Pruning:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">cuts</tspan><tspan dx="4" font-weight="400" fill="#3D3554">branches</tspan><tspan dx="4" font-weight="400" fill="#3D3554">that</tspan><tspan dx="4" font-weight="400" fill="#3D3554">can't</tspan><tspan dx="4" font-weight="400" fill="#3D3554">lead</tspan><tspan dx="4" font-weight="400" fill="#3D3554">anywhere</tspan><tspan dx="4" font-weight="400" fill="#3D3554">useful.</tspan></text>
<circle cx="36" cy="210.5" r="6" fill="#7C5CFF"/>
<text x="58" y="217" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Iteration:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">iterative</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Fibonacci</tspan><tspan dx="4" font-weight="400" fill="#3D3554">is</tspan><tspan dx="4" font-weight="400" fill="#3D3554">O(n)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">time,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">O(1)</tspan><tspan dx="4" font-weight="400" fill="#3D3554">space</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">proof</tspan><tspan dx="4" font-weight="400" fill="#3D3554">that</tspan></text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">exponential</tspan><tspan dx="4" font-weight="400" fill="#3D3554">is</tspan><tspan dx="4" font-weight="400" fill="#3D3554">rarely</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">only</tspan><tspan dx="4" font-weight="400" fill="#3D3554">option.</tspan></text>
</svg>