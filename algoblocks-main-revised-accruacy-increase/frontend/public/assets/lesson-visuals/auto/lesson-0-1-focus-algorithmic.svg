<svg viewBox="0 0 640 292" width="640" height="292" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="292" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="292" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">Focus on Algorithmic Reasoning</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Algorithmic</tspan><tspan dx="4" font-weight="700" fill="#2B005C">reasoning:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">designing</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">solution</tspan><tspan dx="4" font-weight="400" fill="#3D3554">step</tspan><tspan dx="4" font-weight="400" fill="#3D3554">by</tspan><tspan dx="4" font-weight="400" fill="#3D3554">step,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">before</tspan><tspan dx="4" font-weight="400" fill="#3D3554">worrying</tspan><tspan dx="4" font-weight="400" fill="#3D3554">about</tspan></text>
<text x="58" y="92" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">how</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">type</tspan><tspan dx="4" font-weight="400" fill="#3D3554">it.</tspan></text>
<circle cx="36" cy="128.5" r="6" fill="#7C5CFF"/>
<text x="58" y="135" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Pattern</tspan><tspan dx="4" font-weight="700" fill="#2B005C">recognition:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">noticing</tspan><tspan dx="4" font-weight="400" fill="#3D3554">when</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">loop</tspan><tspan dx="4" font-weight="400" fill="#3D3554">would</tspan><tspan dx="4" font-weight="400" fill="#3D3554">replace</tspan><tspan dx="4" font-weight="400" fill="#3D3554">ten</tspan><tspan dx="4" font-weight="400" fill="#3D3554">repeated</tspan><tspan dx="4" font-weight="400" fill="#3D3554">blocks.</tspan></text>
<circle cx="36" cy="176.5" r="6" fill="#7C5CFF"/>
<text x="58" y="183" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Structural</tspan><tspan dx="4" font-weight="700" fill="#2B005C">decomposition:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">breaking</tspan><tspan dx="4" font-weight="400" fill="#3D3554">one</tspan><tspan dx="4" font-weight="400" fill="#3D3554">big,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">intimidating</tspan><tspan dx="4" font-weight="400" fill="#3D3554">task</tspan><tspan dx="4" font-weight="400" fill="#3D3554">into</tspan><tspan dx="4" font-weight="400" fill="#3D3554">several</tspan></text>
<text x="58" y="202" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">small,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">manageable</tspan><tspan dx="4" font-weight="400" fill="#3D3554">ones.</tspan></text>
<circle cx="36" cy="238.5" r="6" fill="#7C5CFF"/>
<text x="58" y="245" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Debugging:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">tracing</tspan><tspan dx="4" font-weight="400" fill="#3D3554">through</tspan><tspan dx="4" font-weight="400" fill="#3D3554">*logic*</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">find</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">mistake,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">instead</tspan><tspan dx="4" font-weight="400" fill="#3D3554">of</tspan><tspan dx="4" font-weight="400" fill="#3D3554">squinting</tspan><tspan dx="4" font-weight="400" fill="#3D3554">at</tspan></text>
<text x="58" y="264" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">characters</tspan><tspan dx="4" font-weight="400" fill="#3D3554">looking</tspan><tspan dx="4" font-weight="400" fill="#3D3554">for</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">typo.</tspan></text>
</svg>