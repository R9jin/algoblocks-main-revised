<svg viewBox="0 0 640 187" width="640" height="187" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="187" rx="16" fill="#FFFBF2" stroke="#FCE3B3" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="187" rx="4" fill="#F59E0B"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7A4A02">Why Order Matters</text>
<polygon points="36.0,57.0 38.5,63.1 45.0,63.6 40.0,67.8 41.6,74.2 36.0,70.7 30.4,74.2 32.0,67.8 27.0,63.6 33.5,63.1" fill="#F59E0B"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#7A4A02">Correct</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">order:</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">sum</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">the</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">values,</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">then</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">divide</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">by</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">the</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">count,</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">then</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">print</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">the</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">result.</tspan></text>
<polygon points="36.0,105.0 38.5,111.1 45.0,111.6 40.0,115.8 41.6,122.2 36.0,118.7 30.4,122.2 32.0,115.8 27.0,111.6 33.5,111.1" fill="#F59E0B"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#7A4A02">Incorrect</tspan><tspan dx="4" font-weight="700" fill="#7A4A02">order:</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">print</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">the</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">result</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">*before*</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">calculating</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">it.</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">There's</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">nothing</tspan></text>
<text x="58" y="140" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A4A2E">broken</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">about</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">the</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">blocks</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">themselves</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">--</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">you'd</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">just</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">be</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">printing</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">an</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">undefined</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">or</tspan></text>
<text x="58" y="159" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A4A2E">leftover</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">value,</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">because</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">the</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">calculation</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">hadn't</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">happened</tspan><tspan dx="4" font-weight="400" fill="#5A4A2E">yet.</tspan></text>
</svg>