<svg viewBox="0 0 640 202" width="640" height="202" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="202" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="202" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">The Exponential Cost of Grids</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">n</tspan><tspan dx="4" font-weight="400" fill="#3D3554">=</tspan><tspan dx="4" font-weight="400" fill="#3D3554">1,000</tspan><tspan dx="4" font-weight="400" fill="#3D3554">→</tspan><tspan dx="4" font-weight="400" fill="#3D3554">1M</tspan><tspan dx="4" font-weight="400" fill="#3D3554">cells</tspan><tspan dx="4" font-weight="400" fill="#3D3554">(~8</tspan><tspan dx="4" font-weight="400" fill="#3D3554">MB).</tspan></text>
<circle cx="36" cy="114.5" r="6" fill="#7C5CFF"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">n</tspan><tspan dx="4" font-weight="400" fill="#3D3554">=</tspan><tspan dx="4" font-weight="400" fill="#3D3554">10,000</tspan><tspan dx="4" font-weight="400" fill="#3D3554">→</tspan><tspan dx="4" font-weight="400" fill="#3D3554">100M</tspan><tspan dx="4" font-weight="400" fill="#3D3554">cells</tspan><tspan dx="4" font-weight="400" fill="#3D3554">(~800</tspan><tspan dx="4" font-weight="400" fill="#3D3554">MB).</tspan></text>
<circle cx="36" cy="162.5" r="6" fill="#7C5CFF"/>
<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">n</tspan><tspan dx="4" font-weight="400" fill="#3D3554">=</tspan><tspan dx="4" font-weight="400" fill="#3D3554">100,000</tspan><tspan dx="4" font-weight="400" fill="#3D3554">→</tspan><tspan dx="4" font-weight="400" fill="#3D3554">10</tspan><tspan dx="4" font-weight="400" fill="#3D3554">billion</tspan><tspan dx="4" font-weight="400" fill="#3D3554">cells</tspan><tspan dx="4" font-weight="400" fill="#3D3554">(</tspan><tspan dx="4" font-weight="700" fill="#2B005C">~80</tspan><tspan dx="4" font-weight="700" fill="#2B005C">GB</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">too</tspan><tspan dx="4" font-weight="400" fill="#3D3554">much</tspan><tspan dx="4" font-weight="400" fill="#3D3554">for</tspan><tspan dx="4" font-weight="400" fill="#3D3554">most</tspan><tspan dx="4" font-weight="400" fill="#3D3554">systems).</tspan></text>
</svg>