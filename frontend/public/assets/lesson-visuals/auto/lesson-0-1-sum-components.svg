<svg viewBox="0 0 640 202" width="640" height="202" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="202" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="202" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">Three Main Components</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Toolbox:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">every</tspan><tspan dx="4" font-weight="400" fill="#3D3554">block</tspan><tspan dx="4" font-weight="400" fill="#3D3554">you</tspan><tspan dx="4" font-weight="400" fill="#3D3554">can</tspan><tspan dx="4" font-weight="400" fill="#3D3554">use,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">organized</tspan><tspan dx="4" font-weight="400" fill="#3D3554">by</tspan><tspan dx="4" font-weight="400" fill="#3D3554">category.</tspan></text>
<circle cx="36" cy="114.5" r="6" fill="#7C5CFF"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Workspace</tspan><tspan dx="4" font-weight="700" fill="#2B005C">Canvas:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">where</tspan><tspan dx="4" font-weight="400" fill="#3D3554">you</tspan><tspan dx="4" font-weight="400" fill="#3D3554">actually</tspan><tspan dx="4" font-weight="400" fill="#3D3554">build,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">by</tspan><tspan dx="4" font-weight="400" fill="#3D3554">dragging</tspan><tspan dx="4" font-weight="400" fill="#3D3554">and</tspan><tspan dx="4" font-weight="400" fill="#3D3554">connecting.</tspan></text>
<circle cx="36" cy="162.5" r="6" fill="#7C5CFF"/>
<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Output</tspan><tspan dx="4" font-weight="700" fill="#2B005C">Console:</tspan><tspan dx="4" font-weight="400" fill="#3D3554">where</tspan><tspan dx="4" font-weight="400" fill="#3D3554">you</tspan><tspan dx="4" font-weight="400" fill="#3D3554">see</tspan><tspan dx="4" font-weight="400" fill="#3D3554">results,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">timing,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">and</tspan><tspan dx="4" font-weight="400" fill="#3D3554">errors.</tspan></text>
