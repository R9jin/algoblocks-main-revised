<svg viewBox="0 0 640 230" width="640" height="230" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="230" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="230" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">Types of Loops</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">Repeat</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Counted):</tspan><tspan dx="4" font-weight="400" fill="#3D3554">runs</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">fixed</tspan><tspan dx="4" font-weight="400" fill="#3D3554">number</tspan><tspan dx="4" font-weight="400" fill="#3D3554">of</tspan><tspan dx="4" font-weight="400" fill="#3D3554">times</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">reach</tspan><tspan dx="4" font-weight="400" fill="#3D3554">for</tspan><tspan dx="4" font-weight="400" fill="#3D3554">this</tspan><tspan dx="4" font-weight="400" fill="#3D3554">when</tspan><tspan dx="4" font-weight="400" fill="#3D3554">you</tspan><tspan dx="4" font-weight="400" fill="#3D3554">already</tspan></text>
<text x="58" y="92" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">know</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">count.</tspan></text>
<circle cx="36" cy="128.5" r="6" fill="#7C5CFF"/>
<text x="58" y="135" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">While</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Conditional):</tspan><tspan dx="4" font-weight="400" fill="#3D3554">runs</tspan><tspan dx="4" font-weight="400" fill="#3D3554">until</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">condition</tspan><tspan dx="4" font-weight="400" fill="#3D3554">turns</tspan><tspan dx="4" font-weight="400" fill="#3D3554">False</tspan><tspan dx="4" font-weight="400" fill="#3D3554">--</tspan><tspan dx="4" font-weight="400" fill="#3D3554">use</tspan><tspan dx="4" font-weight="400" fill="#3D3554">this</tspan><tspan dx="4" font-weight="400" fill="#3D3554">when</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan></text>
<text x="58" y="154" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">count</tspan><tspan dx="4" font-weight="400" fill="#3D3554">depends</tspan><tspan dx="4" font-weight="400" fill="#3D3554">on</tspan><tspan dx="4" font-weight="400" fill="#3D3554">something</tspan><tspan dx="4" font-weight="400" fill="#3D3554">that</tspan><tspan dx="4" font-weight="400" fill="#3D3554">changes</tspan><tspan dx="4" font-weight="400" fill="#3D3554">as</tspan><tspan dx="4" font-weight="400" fill="#3D3554">you</tspan><tspan dx="4" font-weight="400" fill="#3D3554">go.</tspan></text>
<circle cx="36" cy="190.5" r="6" fill="#7C5CFF"/>
<text x="58" y="197" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#2B005C">For-Each</tspan><tspan dx="4" font-weight="700" fill="#2B005C">(Iterative):</tspan><tspan dx="4" font-weight="400" fill="#3D3554">automatically</tspan><tspan dx="4" font-weight="400" fill="#3D3554">visits</tspan><tspan dx="4" font-weight="400" fill="#3D3554">every</tspan><tspan dx="4" font-weight="400" fill="#3D3554">item</tspan><tspan dx="4" font-weight="400" fill="#3D3554">in</tspan><tspan dx="4" font-weight="400" fill="#3D3554">an</tspan><tspan dx="4" font-weight="400" fill="#3D3554">array,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">one</tspan><tspan dx="4" font-weight="400" fill="#3D3554">at</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">time.</tspan></text>
</svg>