<svg viewBox="0 0 640 312" width="640" height="312" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="312" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<rect x="0" y="0" width="8" height="312" rx="4" fill="#7C5CFF"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B005C">The Visualizer Workflow</text>
<circle cx="36" cy="66.5" r="6" fill="#7C5CFF"/>
<text x="58" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">1.</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Open</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">visualizer</tspan><tspan dx="4" font-weight="400" fill="#3D3554">panel.</tspan></text>
<circle cx="36" cy="114.5" r="6" fill="#7C5CFF"/>
<text x="58" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">2.</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Step</tspan><tspan dx="4" font-weight="400" fill="#3D3554">through</tspan><tspan dx="4" font-weight="400" fill="#3D3554">your</tspan><tspan dx="4" font-weight="400" fill="#3D3554">code.</tspan></text>
<circle cx="36" cy="162.5" r="6" fill="#7C5CFF"/>
<text x="58" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">3.</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Watch</tspan><tspan dx="4" font-weight="400" fill="#3D3554">variables</tspan><tspan dx="4" font-weight="400" fill="#3D3554">change</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">confirm</tspan><tspan dx="4" font-weight="400" fill="#3D3554">your</tspan><tspan dx="4" font-weight="400" fill="#3D3554">logic</tspan><tspan dx="4" font-weight="400" fill="#3D3554">is</tspan><tspan dx="4" font-weight="400" fill="#3D3554">doing</tspan><tspan dx="4" font-weight="400" fill="#3D3554">what</tspan><tspan dx="4" font-weight="400" fill="#3D3554">you</tspan><tspan dx="4" font-weight="400" fill="#3D3554">think</tspan><tspan dx="4" font-weight="400" fill="#3D3554">it's</tspan><tspan dx="4" font-weight="400" fill="#3D3554">doing.</tspan></text>
<circle cx="36" cy="210.5" r="6" fill="#7C5CFF"/>
<text x="58" y="217" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">4.</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Check</tspan><tspan dx="4" font-weight="400" fill="#3D3554">arrays</tspan><tspan dx="4" font-weight="400" fill="#3D3554">after</tspan><tspan dx="4" font-weight="400" fill="#3D3554">each</tspan><tspan dx="4" font-weight="400" fill="#3D3554">operation</tspan><tspan dx="4" font-weight="400" fill="#3D3554">for</tspan><tspan dx="4" font-weight="400" fill="#3D3554">off-by-one</tspan><tspan dx="4" font-weight="400" fill="#3D3554">errors.</tspan></text>
<circle cx="36" cy="258.5" r="6" fill="#7C5CFF"/>
<text x="58" y="265" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">5.</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Watch</tspan><tspan dx="4" font-weight="400" fill="#3D3554">the</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Call</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Stack</tspan><tspan dx="4" font-weight="400" fill="#3D3554">when</tspan><tspan dx="4" font-weight="400" fill="#3D3554">using</tspan><tspan dx="4" font-weight="400" fill="#3D3554">functions,</tspan><tspan dx="4" font-weight="400" fill="#3D3554">to</tspan><tspan dx="4" font-weight="400" fill="#3D3554">catch</tspan><tspan dx="4" font-weight="400" fill="#3D3554">a</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Stack</tspan><tspan dx="4" font-weight="400" fill="#3D3554">Overflow</tspan><tspan dx="4" font-weight="400" fill="#3D3554">before</tspan><tspan dx="4" font-weight="400" fill="#3D3554">it</tspan></text>
<text x="58" y="284" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#3D3554">happens.</tspan></text>
</svg>