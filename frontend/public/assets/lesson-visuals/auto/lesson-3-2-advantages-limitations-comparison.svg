<svg viewBox="0 0 640 268" width="640" height="268" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="640" height="268" rx="16" fill="#FBFAFF" stroke="#D8CBFF" stroke-width="1.5"/>
<line x1="320.0" y1="46" x2="320.0" y2="254" stroke="#E5E0F5" stroke-width="1.5"/>
<text x="24" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#065F46">Advantages</text>
<circle cx="35" cy="66.5" r="11" fill="#10B981"/>
<path d="M 30 66.5 L 33.5 70.5 L 40.5 62.0" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#065F46">Blazing</tspan><tspan dx="4" font-weight="700" fill="#065F46">fast</tspan><tspan dx="4" font-weight="400" fill="#33534A">on</tspan><tspan dx="4" font-weight="400" fill="#33534A">massive</tspan><tspan dx="4" font-weight="400" fill="#33534A">datasets.</tspan></text>
<circle cx="35" cy="114.5" r="11" fill="#10B981"/>
<path d="M 30 114.5 L 33.5 118.5 L 40.5 110.0" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#33534A">Pure</tspan><tspan dx="4" font-weight="700" fill="#065F46">logarithmic</tspan><tspan dx="4" font-weight="400" fill="#33534A">reduction.</tspan></text>
<circle cx="35" cy="162.5" r="11" fill="#10B981"/>
<path d="M 30 162.5 L 33.5 166.5 L 40.5 158.0" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="169" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#065F46">O(1)</tspan><tspan dx="4" font-weight="700" fill="#065F46">memory</tspan><tspan dx="4" font-weight="400" fill="#33534A">when</tspan><tspan dx="4" font-weight="400" fill="#33534A">written</tspan></text>
<text x="52" y="188" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#33534A">iteratively.</tspan></text>
<circle cx="35" cy="224.5" r="11" fill="#10B981"/>
<path d="M 30 224.5 L 33.5 228.5 L 40.5 220.0" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="231" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#33534A">The</tspan><tspan dx="4" font-weight="400" fill="#33534A">foundation</tspan><tspan dx="4" font-weight="400" fill="#33534A">of</tspan><tspan dx="4" font-weight="400" fill="#33534A">database</tspan><tspan dx="4" font-weight="400" fill="#33534A">indexing.</tspan></text>
<text x="332.0" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7A1E1E">Limitations</text>
<circle cx="343.0" cy="66.5" r="11" fill="#EF4444"/>
<path d="M 339.0 62.5 L 347.0 70.5 M 347.0 62.5 L 339.0 70.5" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="360.0" y="73" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A3B3B">Requires</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">maintaining</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">sorted</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">data.</tspan></text>
<circle cx="343.0" cy="114.5" r="11" fill="#EF4444"/>
<path d="M 339.0 110.5 L 347.0 118.5 M 347.0 110.5 L 339.0 118.5" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="360.0" y="121" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A3B3B">Fails</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">on</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">structures</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">without</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">random</tspan></text>
<text x="360.0" y="140" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A3B3B">access</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">(linked</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">lists).</tspan></text>
<circle cx="343.0" cy="176.5" r="11" fill="#EF4444"/>
<path d="M 339.0 172.5 L 347.0 180.5 M 347.0 172.5 L 339.0 180.5" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="360.0" y="183" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="400" fill="#5A3B3B">Off-by-one</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">pointer</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">errors</tspan><tspan dx="4" font-weight="400" fill="#5A3B3B">cause</tspan></text>
<text x="360.0" y="202" font-family="Arial, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#7A1E1E">infinite</tspan><tspan dx="4" font-weight="700" fill="#7A1E1E">loops.</tspan></text>
</svg>